<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SharedWorker extendedLifetime widget</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 14px; margin: 8px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .muted { color: #555; }
  .ok { color: #070; font-weight: bold; }
  .bad { color: #b00; font-weight: bold; }
  table { border-collapse: collapse; margin: 6px 0; }
  td { padding: 1px 8px 1px 0; vertical-align: top; }
  td:first-child { color: #555; white-space: nowrap; }
  form { display: flex; gap: 4px; margin: 6px 0; }
  form input { flex: 1; }
  ul { margin: 4px 0; padding-left: 20px; max-height: 120px; overflow: auto; }
  pre { background: #f4f4f4; margin: 4px 0; padding: 4px; max-height: 120px; overflow: auto; font-size: 12px; }
  details summary { cursor: pointer; }
</style>

<h1>Widget on asdf.jarhar.com</h1>
<div id=support></div>

<table>
  <tr><td>Embedded in</td><td id=site></td></tr>
  <tr><td>This iframe loaded</td><td id=loaded></td></tr>
  <tr><td>Worker instance</td><td id=worker>connecting…</td></tr>
  <tr><td>Clients</td><td id=clients></td></tr>
  <tr><td>WebSocket</td><td id=ws></td></tr>
</table>

<form id=form>
  <input id=input placeholder="Type a message…" autocomplete=off autofocus>
  <button>Add</button>
  <button type=button id=clear>Clear</button>
</form>
<div class=muted>Messages (kept only in the SharedWorker's memory):</div>
<ul id=messages></ul>

<details>
  <summary>WebSocket log</summary>
  <pre id=wslog></pre>
</details>

<script>
const $ = (id) => document.getElementById(id);
const loadedAt = Date.now();
const site = (location.ancestorOrigins && location.ancestorOrigins[0]) ||
             (document.referrer && new URL(document.referrer).origin) ||
             '(top level)';
$('site').textContent = site;
$('loaded').textContent = new Date(loadedAt).toLocaleTimeString();

const ago = (t) => {
  const s = Math.round((Date.now() - t) / 1000);
  return s < 60 ? `${s}s ago` : `${Math.floor(s / 60)}m ${s % 60}s ago`;
};
const fmtTime = (t) => new Date(t).toLocaleTimeString();

let state = null;
let worker = null;

if (!('SharedWorker' in window)) {
  $('support').innerHTML = '<span class=bad>SharedWorker is not supported in this browser.</span>';
} else {
  // Feature-detect extendedLifetime: WebIDL dictionary conversion only reads
  // members the browser knows about, so the getter only runs if supported.
  let extendedLifetimeSupported = false;
  const options = {
    name: 'widget',
    get extendedLifetime() { extendedLifetimeSupported = true; return true; },
  };
  worker = new SharedWorker('widget-worker.js', options);
  $('support').innerHTML = extendedLifetimeSupported
    ? '<span class=ok>✓ SharedWorker extendedLifetime is supported.</span> ' +
      '<span class=muted>The worker should survive navigating to the other site.</span>'
    : '<span class=bad>✗ SharedWorker extendedLifetime is not supported.</span> ' +
      '<span class=muted>The worker will die when this page navigates away, so state will be lost.</span>';

  worker.port.onmessage = (e) => {
    if (e.data && e.data.type === 'state') {
      state = e.data;
      render();
    }
  };
  worker.port.postMessage({ type: 'hello', site });

  addEventListener('pagehide', () => worker.port.postMessage({ type: 'bye' }));

  $('form').onsubmit = (e) => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    worker.port.postMessage({ type: 'add', text, site });
    $('input').value = '';
  };
  $('clear').onclick = () => worker.port.postMessage({ type: 'clear' });
}

function render() {
  if (!state) return;
  const reused = state.workerStartedAt < loadedAt;
  $('worker').innerHTML = '';
  $('worker').append(
    `#${state.workerId}, started ${fmtTime(state.workerStartedAt)} (${ago(state.workerStartedAt)}) `,
    Object.assign(document.createElement('span'), {
      className: reused ? 'ok' : 'muted',
      textContent: reused ? '— survived from before this iframe loaded!' : '— new instance',
    }),
  );
  $('clients').textContent =
    `${state.currentClients} connected now, ${state.totalConnections} total connections over the worker's life`;

  const w = state.ws;
  $('ws').textContent = w.status === 'open'
    ? `open to ${w.url} — connection #${w.connectionCount}, opened ${ago(w.openedAt)}, ` +
      `${w.sent} sent / ${w.received} received`
    : `${w.status} (${w.url})`;

  const ul = $('messages');
  ul.replaceChildren(...state.messages.map((m) => {
    const li = document.createElement('li');
    li.textContent = m.text;
    const meta = document.createElement('span');
    meta.className = 'muted';
    meta.textContent = ` — ${fmtTime(m.time)} from ${m.site}`;
    li.append(meta);
    return li;
  }));
  if (!state.messages.length) {
    ul.innerHTML = '<li class=muted>(none yet)</li>';
  }

  const arrows = { in: '←', out: '→', sys: '•' };
  $('wslog').textContent = w.log
    .map((l) => `${fmtTime(l.time)} ${arrows[l.dir] || ''} ${l.text}`)
    .reverse()
    .join('\n');
}

// Keep the "Xs ago" timers ticking.
setInterval(render, 1000);
</script>
