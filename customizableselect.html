<!DOCTYPE html>

<style>
select, ::picker(select) {
  appearance: base-select;
}
</style>

<p>Customizable select with no attributes:</p>
<select>
  <option>one</option>
  <option>two</option>
  <option>three</option>
</select>

<p>Customizable select with size=4:</p>
<select size=4>
  <option>one</option>
  <option>two</option>
  <option>three</option>
</select>
